<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гимны">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Гимны и Псалмы</title>
</head>
<body>
<header class="app-header">
  <button id="back-btn" class="icon-btn" hidden aria-label="Назад">←</button>
  <h1 id="page-title">Гимны и Псалмы</h1>
  <button id="menu-btn" class="icon-btn" aria-label="Меню">☰</button>
</header>

<main id="app">
  <section id="view-list" class="view">
    <div class="search-box">
      <input type="search" id="search" placeholder="Поиск по названию, тексту, аккордам…" autocomplete="off">
      <button id="clear-search" hidden>×</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="stats" id="stats"></div>
    <ul class="song-list" id="song-list"></ul>
    <div class="empty" id="empty" hidden>Ничего не найдено</div>
  </section>

  <section id="view-song" class="view" hidden>
    <div class="song-head">
      <h2 id="song-title"></h2>
      <div class="song-meta">
        <span id="song-collection" class="tag"></span>
        <span id="song-key" class="tag"></span>
      </div>
      <div class="song-controls">
        <button data-transpose="-1">−</button>
        <button data-transpose="0" class="cur">♮</button>
        <button data-transpose="1">+</button>
        <span id="transpose-val">0</span>
        <button id="scroll-toggle">▶ Авто</button>
      </div>
    </div>
    <div class="song-body" id="song-body"></div>
  </section>
</main>

<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
